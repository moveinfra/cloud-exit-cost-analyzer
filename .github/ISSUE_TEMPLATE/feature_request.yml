name: Feature request
description: A new cloud, scenario, recommendation or option
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation and the decision you want the report to help with.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: checkboxes
    id: rules
    attributes:
      label: Fits the ground rules
      options:
        - label: Works read-only and offline (no runtime calls outside the cluster)
