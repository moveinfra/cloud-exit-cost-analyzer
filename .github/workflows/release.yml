# Push a tag like v0.1.0 to release: multi-arch image to ghcr.io, chart to ghcr.io (OCI) and to the
# Helm repository on GitHub Pages (https://moveinfra.github.io/cloud-exit-cost-analyzer).
name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/moveinfra/cloud-exit-cost-analyzer
  CHART: charts/cloud-exit-cost-analyzer

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Kubernetes cost today vs. on UpCloud, from real usage

      - uses: azure/setup-helm@v4
      - name: Package chart
        run: |
          V=${{ steps.v.outputs.version }}
          sed -i "s/^version:.*/version: $V/; s/^appVersion:.*/appVersion: \"$V\"/" $CHART/Chart.yaml
          helm package $CHART -d dist
      - name: Push chart to ghcr.io (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push dist/*.tgz oci://ghcr.io/moveinfra/charts
      - name: GitHub release with the chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes --title "$GITHUB_REF_NAME"
      - name: Update Helm repository index on gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git worktree add pages origin/gh-pages && (cd pages && git switch -c gh-pages)
          else
            git worktree add --orphan -b gh-pages pages
          fi
          cp artifacthub-repo.yml pages/ 2>/dev/null || true
          URL=https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME
          if [ -f pages/index.yaml ]; then
            helm repo index dist --url "$URL" --merge pages/index.yaml
          else
            helm repo index dist --url "$URL"
          fi
          cp dist/index.yaml pages/index.yaml
          cd pages && git add -A
          git commit -m "Release $GITHUB_REF_NAME" && git push origin gh-pages
