name: CI
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...
      - uses: azure/setup-helm@v4
      - run: helm lint charts/cloud-exit-cost-analyzer
      - run: helm template t charts/cloud-exit-cost-analyzer > /dev/null
