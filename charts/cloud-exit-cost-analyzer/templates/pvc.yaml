{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ceca.fullname" . }}
  labels: {{- include "ceca.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # usage history survives helm uninstall/reinstall
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
