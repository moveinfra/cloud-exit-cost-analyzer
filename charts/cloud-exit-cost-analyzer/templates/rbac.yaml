apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ceca.fullname" . }}
  labels: {{- include "ceca.labels" . | nindent 4 }}
---
# Read-only: lists what runs in the cluster. No secrets, no config maps, no writes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ceca.fullname" . }}
  labels: {{- include "ceca.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, persistentvolumes]
    verbs: [get, list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list]
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ceca.fullname" . }}
  labels: {{- include "ceca.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ceca.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ceca.fullname" . }}
    namespace: {{ .Release.Namespace }}
