apiVersion: v1
kind: Service
metadata:
  name: {{ include "ceca.fullname" . }}
  labels: {{- include "ceca.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ceca.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
